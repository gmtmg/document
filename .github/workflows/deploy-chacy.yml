# チャシーのサーバー（worker/）を Cloudflare Workers に公開する。
# OpenAI の APIキーは GitHub の Secrets から渡すので、コードやサイトには一切出てこない。
#
# いまのチャシーは「キー入力方式」なので、このワークフローは使っていません。
# 下の Secrets を登録すると、自動で「サーバー方式」の公開が動くようになります（登録するまではテストだけ動きます）。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   OPENAI_API_KEY         OpenAI の APIキー
#   CLOUDFLARE_API_TOKEN   Cloudflare の APIトークン（「Edit Cloudflare Workers」テンプレートで作成）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウントID
name: Deploy Chacy server

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-chacy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node worker/test/run.mjs

      - name: Skip deploy (Cloudflare is not set up)
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "CLOUDFLARE_API_TOKEN が登録されていないので、公開はしません（キー入力方式ではサーバーは不要です）。"

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
